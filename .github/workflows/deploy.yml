name: CI/CD - Build and Deploy Spring Boot App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3️⃣ Build backend JAR (optional — for test)
      - name: Build with Maven
        working-directory: ./backend
        run: mvn -B package -DskipTests

      # 4️⃣ Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build & Push Docker image
      - name: Build and Push Docker image
        working-directory: ./backend
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/spring-backend:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 6️⃣ Deploy to VPS via SSH
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-backend:latest
            echo "Stopping old container..."
            docker stop spring-backend || true && docker rm spring-backend || true
            echo "Starting new container..."
            docker run -d --name spring-backend -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/spring-backend:latest
