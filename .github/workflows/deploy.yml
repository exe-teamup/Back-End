name: CI/CD Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Get Short SHA
        id: git_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          # Use the output from the previous step
          docker build -t ${{ secrets.DOCKER_USERNAME }}/exe-backend:${{ steps.git_sha.outputs.SHORT_SHA }} -t ${{ secrets.DOCKER_USERNAME }}/exe-backend:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        run: |
          # Use the same output again to ensure consistency
          docker push ${{ secrets.DOCKER_USERNAME }}/exe-backend:${{ steps.git_sha.outputs.SHORT_SHA }}
          docker push ${{ secrets.DOCKER_USERNAME }}/exe-backend:latest

      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          NEW_TAG: ${{ steps.git_sha.outputs.SHORT_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/exe-teamup
            
            # Ensure the IMAGE_TAG variable exists in the .env file
            if ! grep -q "^IMAGE_TAG=" .env; then
              echo "IMAGE_TAG=" >> .env
            fi
            
            # This script will now correctly receive the $NEW_TAG variable
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${NEW_TAG}/" .env
            
            docker-compose pull backend
            docker-compose up -d --force-recreate backend
