name: Java CI/CD with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - uses: actions/checkout@v4

      # Bước 2: Cài đặt JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Build JAR với Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Bước 4: Cập nhật dependency graph
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

      # Bước 5: Cài đặt Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # Bước 6: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t exe-teamup-backend:latest -f Back-End/Dockerfile .

      # Bước 7: Lưu image thành tar
      - name: Save Docker image
        run: docker save -o exe-teamup-backend.tar exe-teamup-backend:latest

      # Bước 8: Upload image tar lên server
      - name: Upload Docker image to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "exe-teamup-backend.tar"
          target: "/opt/exe-teamup/"

      # Bước 9: Load image và restart docker-compose
      - name: Deploy to Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/exe-teamup
            docker load -i exe-teamup-backend.tar
            docker-compose up -d --build backend
            rm exe-teamup-backend.tar
