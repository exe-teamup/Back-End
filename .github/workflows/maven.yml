name: Java CI/CD with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧱 Bước 1: Checkout mã nguồn
      - uses: actions/checkout@v4

      # ☕ Bước 2: Cài đặt JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

# 🏗️ Bước 3: Build với Maven (skip tests để nhanh hơn)
      - name: Build with Maven
        run: |
          cd Back-End
          mvn clean install -DskipTests
          mvn dependency:tree -DoutputFile=dependency-tree.txt

      # 🐳 Bước 4: Thiết lập Docker Buildx
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # 🧩 Bước 5: Build Docker image cho backend
      - name: Build Docker image
        run: |
          docker build -t exe-teamup:latest -f Back-End/Dockerfile .

      # 📦 Bước 6: Lưu Docker image thành file .tar
      - name: Save Docker image
        run: docker save -o exe-teamup.tar exe-teamup:latest

      # 🚀 Bước 7: Upload file .tar lên VPS
      - name: Upload Docker image to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "exe-teamup.tar"
          target: "/opt/exe-teamup/"

      # 🔄 Bước 8: Load image & restart backend container bằng docker-compose
      - name: Deploy to Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/exe-teamup
            echo "🧩 Loading new Docker image..."
            docker load -i exe-teamup.tar
            echo "🧹 Cleaning old images..."
            docker image prune -f
            echo "🚀 Restarting backend container..."
            docker-compose up -d --no-deps --build backend
            echo "🧼 Removing temp file..."
            rm exe-teamup.tar
            echo "✅ Deployment completed successfully!"
