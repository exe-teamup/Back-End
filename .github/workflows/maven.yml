name: Java CI/CD with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - uses: actions/checkout@v4

      # Bước 2: Cài đặt JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

       # Bước 3: Build với Maven và tạo dependency tree (skip tests)
      - name: Build with Maven
        working-directory: ./Back-End
        run: |
          mvn clean install -DskipTests -Dspring.application.name=exe-teamup
          mvn dependency:tree -DoutputFile=dependency-tree.txt
      
      # Bước 4: Cập nhật dependency graph
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5
        with:
          working-directory: ./Back-End

      # Bước 5: Cài đặt Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # Bước 6: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t exe-teamup:latest -f Back-End/Dockerfile .
        # Thay exe-teamup-backend:latest bằng exe-teamup:latest

      # Bước 7: Lưu image thành tar
      - name: Save Docker image
        run: docker save -o exe-teamup.tar exe-teamup:latest
        # Thay exe-teamup-backend.tar bằng exe-teamup.tar

      # Bước 8: Upload image tar lên server
      - name: Upload Docker image to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "exe-teamup.tar"
          target: "/opt/exe-teamup/"

      # Bước 9: Load image và restart docker-compose
      - name: Deploy to Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/exe-teamup
            docker load -i exe-teamup.tar
            docker-compose up -d --build backend
            rm exe-teamup.tar
