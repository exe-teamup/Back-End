server {
    listen 80;
    server_name exe-teamup.edu.vn 14.225.207.237;

    location / {
        proxy_pass http://exe-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/exe-teamup.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exe-teamup.edu.vn/privkey.pem;

    location / {
        proxy_pass http://exe-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}