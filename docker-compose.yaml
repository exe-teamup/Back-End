networks:
  app-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: exe-mysql
    restart: always
    env_file:
      - ./.env.mysql
    volumes:
      - ./db/mysql_data:/var/lib/mysql
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3306:3306"
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: exe-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - app-network

  backend:
    image: quangdao04/exe-backend:${BE_IMAGE_TAG:-latest}
    container_name: exe-backend
    restart: always
    env_file:
      - ./.env.backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    volumes:
      - "maven_cache:/root/.m2"
      - ${FCM_CREDENTIALS_FILE_PATH}:/app/config/firebase-admin.json
    networks:
      - app-network

  frontend:
    build: ./Front-End
    container_name: exe-frontend
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: exe-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  maven_cache: {}
