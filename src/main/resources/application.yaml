spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: jdbc:mysql://${LOCAL_DB_URL}/${LOCAL_DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    open-in-view: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: dd-MM-yyyy

springdoc:
  api-docs:
    path: /api/docs/api-docs
  swagger-ui:
    path: /api/docs

server:
  port: 8080
  forward-headers-strategy: framework
