spring:
  application:
    name: exe-teamup

  datasource:
    url: jdbc:mysql://localhost:3306/exe_teamup?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh  # Updated timezone to match your app; align with hibernate.jdbc.time_zone if kept
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect  # Explicitly added: Use MySQL8Dialect if your MySQL version is 8+
        format_sql: true
        # jdbc.time_zone: Asia/Ho_Chi_Minh  # Optional: Remove or comment out to avoid conflicts with serverTimezone in URL
    open-in-view: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: dd-MM-yyyy

server:
  port: 8081
  forward-headers-strategy: framework

token:
