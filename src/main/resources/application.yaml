spring:
  application:
    name: exe-teamup

  datasource:
    url: jdbc:mysql://localhost:3306/exe_teamup?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    open-in-view: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: dd-MM-yyyy

server:
  port: 8081
  forward-headers-strategy: framework

